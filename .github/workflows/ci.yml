name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Lint with ruff
        run: poetry run ruff check app tests

      - name: Check formatting with ruff format
        # ruff format replaces black + isort. Older isort/black checks were
        # removed once the codebase migrated to ruff-canonical formatting.
        run: poetry run ruff format --check app tests
        continue-on-error: true

      - name: Type-check with mypy
        # Advisory: codebase isn't fully typed yet. Surfaces issues but
        # doesn't block deploys. Flip continue-on-error to false once the
        # backlog of mypy errors is cleared.
        run: poetry run mypy app
        continue-on-error: true

  test:
    name: Run tests (pytest + alembic fresh-DB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Install project
        run: poetry install --no-interaction

      # Fresh-DB migration gate. A broken migration at HEAD fails CI before
      # tests run — no more "first prod deploy" surprises.
      - name: Alembic upgrade head on fresh DB
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          # Settings() loads at module import; alembic env.py imports config,
          # so these must be set even though the migration itself doesn't use them.
          SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
          ENVIRONMENT: test
        run: poetry run alembic upgrade head

      - name: Run tests with coverage
        env:
          SERVER_HOST: "http://localhost:8000"
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: ci-test-secret-key-do-not-use-in-prod
          ENVIRONMENT: "test"
          # Force-fake all third-party providers in CI so tests never hit
          # real Termii / Resend / Paystack / VTPass / FCM endpoints.
          FORCE_FAKE_PROVIDERS: "true"
          # Placeholder values for factory tests that monkeypatch
          # FORCE_FAKE_PROVIDERS=False and then construct the real client.
          # The real client constructors only check that these are non-empty;
          # they never actually call the upstream APIs in tests.
          PAYSTACK_SECRET_KEY: "sk_test_ci_placeholder_not_used"
          PAYSTACK_PUBLIC_KEY: "pk_test_ci_placeholder_not_used"
          VTPASS_API_KEY: "vtpass_api_ci_placeholder"
          VTPASS_PUBLIC_KEY: "vtpass_pub_ci_placeholder"
          VTPASS_SECRET_KEY: "vtpass_sec_ci_placeholder"
          # Marker used by env-conditional skips for tests that can't run
          # under GitHub Actions threading characteristics.
          CI: "true"
        run: poetry run pytest --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  semgrep-scan:
    name: SAST (Semgrep, source patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install semgrep
        run: pipx install semgrep

      - name: Run security scan
        run: |
          if [ -x ./scripts/security-scan.sh ]; then
            ./scripts/security-scan.sh
          else
            echo "scripts/security-scan.sh not present; skipping semgrep SAST."
          fi

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, semgrep-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: timpbills-api:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: SAST (Trivy, dependency CVEs)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
