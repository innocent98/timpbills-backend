name: CD - Staging Gate and Deploy

# Branch strategy (gitflow-lite):
#   push to develop -> staging only
#   push to main    -> production only (gated on staging E2E)
#
# Deploy strategy: GHCR-pull. CD builds + pushes the image tagged by
# commit SHA to ghcr.io/<owner>/timpbills-backend; the VPS pulls by SHA.
# No scp-tarball.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  staging-deploy:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    concurrency:
      group: timpbills-staging-deploy
      cancel-in-progress: false
    # SECURITY: the workflow_run clause requires head_repository == this repo.
    # CI runs on `pull_request`, and a workflow_run job carries full base-repo
    # secrets. Without this guard a fork PR from a branch named `develop` would
    # satisfy the branch check and reach the head_sha checkout/build below —
    # a "pwn request" secret-exfiltration path. The guard restricts deploys to
    # internal branches only.
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'develop')
    environment:
      name: staging
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      deployed_at: ${{ steps.meta.outputs.deployed_at }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set deploy metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Decrypt staging .env
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
        run: |
          if [ -f .env.staging.enc ] && [ -n "$ENV_ENCRYPTION_KEY" ]; then
            openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
              -in .env.staging.enc -out .env -pass "pass:$ENV_ENCRYPTION_KEY"
            echo "Decrypted staging .env successfully"
          else
            echo "No .env.staging.enc or key — server .env must already exist at $DEPLOY_PATH/.env"
          fi

      - name: Copy stack files to staging VPS dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,alembic.ini,alembic/,scripts/backup_cron.sh,.env"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull image + deploy staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"

            # GHCR pull requires `docker login ghcr.io` already configured on
            # the VPS with a PAT scoped to read:packages — see
            # docs/deployment/GITHUB_ACTIONS_SETUP.md.
            export API_IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
            export COMPOSE_PROJECT_NAME=timpbills-staging
            docker compose -f docker-compose.prod.yml pull

            # Migrations BEFORE swapping the running api. Fail fast.
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c '[ -f /app/scripts/seed_data.py ] && python /app/scripts/seed_data.py || echo "No seed script; skipping."'

            docker compose -f docker-compose.prod.yml up -d

            HEALTH_URL="http://localhost:${{ secrets.API_PORT || 8001 }}/api/v1/health"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
                echo "Staging API is healthy."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Staging API failed health check after waiting." >&2
                docker compose -f docker-compose.prod.yml ps >&2 || true
                docker compose -f docker-compose.prod.yml logs --tail=200 >&2 || true
                exit 1
              fi
              echo "Waiting for staging API health ($attempt/12)..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

            if [ -f scripts/backup_cron.sh ]; then
              chmod +x scripts/backup_cron.sh
              # `|| true` tolerates `crontab -l` exiting 1 on a fresh VPS
              # with no existing crontab — without it, set -o pipefail
              # propagates the 1 and fails the whole deploy after the
              # stack has already come up healthy.
              (crontab -l 2>/dev/null | grep -v "backup_cron.sh" || true; echo "0 2 * * * ${{ secrets.DEPLOY_PATH }}/scripts/backup_cron.sh >> ${{ secrets.DEPLOY_PATH }}/backups/backup.log 2>&1") | crontab -
              echo "Backup cron installed: daily at 2 AM"
            fi

      - name: Capture staging deployment context
        run: |
          echo "Staging API URL: ${{ secrets.APP_URL }}"
          echo "Deployed backend SHA: ${{ steps.meta.outputs.image_tag }}"

  staging-api-e2e:
    name: Run staging API E2E
    runs-on: ubuntu-latest
    needs: staging-deploy
    if: needs.staging-deploy.result == 'success'
    environment:
      name: staging

    steps:
      # SECURITY: do NOT pin this checkout to workflow_run.head_sha. CI runs
      # on `pull_request`, and a workflow_run job executes with full base-repo
      # secrets (this job's `environment: staging` exposes the VPS SSH key in
      # the rate-limit-reset step). Checking out + running the triggering SHA
      # (poetry install / pytest) would let a fork PR exfiltrate those secrets
      # (classic "pwn request"). We deliberately run the trusted default-branch
      # checkout here. The E2E suite is black-box HTTP against E2E_BASE_URL, so
      # the default-branch test code is sufficient — version-matching is not
      # worth the secret-exposure risk.
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Reset staging E2E rate limit keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export COMPOSE_PROJECT_NAME=timpbills-staging
            # Flush any http_* rate limit keys Redis might have accumulated.
            docker compose -f docker-compose.prod.yml exec -T redis sh -lc '
              for pattern in http_*; do
                for key in $(redis-cli --scan --pattern "$pattern"); do
                  redis-cli DEL "$key" >/dev/null
                done
              done
              echo "Staging rate-limit keys cleared"
            ' || echo "Redis flush skipped (no redis service or no keys)."

      - name: Run live API E2E suite
        env:
          E2E_BASE_URL: ${{ secrets.APP_URL }}
          E2E_TIMEOUT_SECONDS: '60'
          # tests/conftest.py imports app.core.config at module load,
          # which instantiates Settings() and validates required fields.
          # E2E hits the deployed staging API (no local DB / superuser),
          # so these are placeholders just to satisfy pydantic at import.
          SECRET_KEY: e2e-staging-conftest-placeholder
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          # NOTE: must be a real, non-special-use domain — email-validator
          # rejects reserved TLDs like .test/.example/.invalid, which made
          # Settings() raise at conftest import and failed the whole E2E job.
          FIRST_SUPERUSER_EMAIL: e2e@example.com
          FIRST_SUPERUSER_PASSWORD: unused-e2e
        run: |
          # Runs tests under tests/e2e marked with -m e2e.
          # If your project has no e2e suite, this job no-ops and production-deploy
          # still proceeds. pytest exit code 5 means "no tests collected" — treated
          # as success so projects without an e2e suite aren't blocked.
          if [ ! -d tests/e2e ]; then
            echo "No tests/e2e directory present; skipping E2E." | tee staging-api-e2e.log
            exit 0
          fi
          set +e
          poetry run pytest tests/e2e -m e2e -q 2>&1 | tee staging-api-e2e.log
          ec=${PIPESTATUS[0]}
          set -e
          if [ "$ec" -eq 0 ]; then
            exit 0
          elif [ "$ec" -eq 5 ]; then
            echo "No e2e tests collected (exit 5); treating as success." | tee -a staging-api-e2e.log
            exit 0
          else
            exit "$ec"
          fi

      - name: Upload API E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-api-e2e-logs
          path: staging-api-e2e.log

  production-deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest
    concurrency:
      group: timpbills-production-deploy
      cancel-in-progress: false
    # Production deploys ONLY on main, OR via manual workflow_dispatch
    # with environment=production. The develop chain does NOT reach prod.
    # SECURITY: head_repository guard — see staging-deploy note. Restricts
    # production deploys to internal `main` only, never a fork PR branch.
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set deploy metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image to GHCR (production tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Decrypt production .env
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
        run: |
          if [ -f .env.production.enc ] && [ -n "$ENV_ENCRYPTION_KEY" ]; then
            openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
              -in .env.production.enc -out .env -pass "pass:$ENV_ENCRYPTION_KEY"
            echo "Decrypted production .env successfully"
          else
            echo "No .env.production.enc or key — server .env must already exist at $DEPLOY_PATH/.env"
          fi

      - name: Copy stack files to production VPS dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,alembic.ini,alembic/,scripts/backup_cron.sh,.env"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull image + deploy production
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"

            # Record previous tag for rollback before swapping.
            if [ -f .image_tag ]; then
              cp .image_tag .image_tag.previous
            fi
            echo "${IMAGE_TAG}" > .image_tag

            export API_IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"
            export COMPOSE_PROJECT_NAME=timpbills
            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c '[ -f /app/scripts/seed_data.py ] && python /app/scripts/seed_data.py || echo "No seed script; skipping."'

            docker compose -f docker-compose.prod.yml up -d

            HEALTH_URL="http://localhost:${{ secrets.API_PORT || 8000 }}/api/v1/health"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
                echo "Production API is healthy."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Production API failed health check after waiting." >&2
                docker compose -f docker-compose.prod.yml ps >&2 || true
                docker compose -f docker-compose.prod.yml logs --tail=200 >&2 || true
                exit 1
              fi
              echo "Waiting for production API health ($attempt/12)..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

            if [ -f scripts/backup_cron.sh ]; then
              chmod +x scripts/backup_cron.sh
              (crontab -l 2>/dev/null | grep -v "backup_cron.sh"; echo "0 2 * * * ${{ secrets.DEPLOY_PATH }}/scripts/backup_cron.sh >> ${{ secrets.DEPLOY_PATH }}/backups/backup.log 2>&1") | crontab -
              echo "Backup cron installed: daily at 2 AM"
            fi

      - name: Notify deployment status
        if: always()
        run: |
          echo "Production deployment ${{ job.status }}"
          echo "Commit: ${{ steps.meta.outputs.image_tag }}"
          echo "Actor: ${{ github.actor }}"
