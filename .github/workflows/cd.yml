name: CD - Staging Gate and Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  staging-deploy:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    concurrency:
      group: timpbills-staging-deploy
      cancel-in-progress: false
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main'))
    environment:
      name: staging
    outputs:
      deployed_at: ${{ steps.meta.outputs.deployed_at }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set deploy timestamp
        id: meta
        run: echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save API image
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t timpbills-api:$IMAGE_TAG .
          docker save timpbills-api:$IMAGE_TAG | gzip > api-image.tar.gz

      - name: Decrypt staging .env
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
        run: |
          if [ -f .env.staging.enc ] && [ -n "$ENV_ENCRYPTION_KEY" ]; then
            openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
              -in .env.staging.enc -out .env -pass "pass:$ENV_ENCRYPTION_KEY"
            echo "Decrypted staging .env successfully"
          else
            echo "No .env.staging.enc or key — server .env must already exist at $DEPLOY_PATH/.env"
          fi

      - name: Copy files to staging stack directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "api-image.tar.gz,docker-compose.prod.yml,alembic.ini,alembic/,.env"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy API to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            docker load < api-image.tar.gz
            export API_IMAGE="timpbills-api:${{ github.event.workflow_run.head_sha || github.sha }}"
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            # Optional seed hook: only runs if scripts/seed_data.py exists in the image.
            docker compose -f docker-compose.prod.yml run --rm api sh -c '[ -f /app/scripts/seed_data.py ] && python /app/scripts/seed_data.py || echo "No seed script; skipping."'
            docker compose -f docker-compose.prod.yml up -d
            HEALTH_URL="http://localhost:${{ secrets.API_PORT || 8000 }}/api/v1/health"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
                echo "Staging API is healthy."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Staging API failed health check after waiting." >&2
                docker compose -f docker-compose.prod.yml ps >&2 || true
                docker compose -f docker-compose.prod.yml logs --tail=200 >&2 || true
                exit 1
              fi
              echo "Waiting for staging API health ($attempt/12)..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            rm -f api-image.tar.gz
            # Optional: install daily backup cron if scripts/backup_cron.sh exists.
            if [ -f scripts/backup_cron.sh ]; then
              chmod +x scripts/backup_cron.sh
              (crontab -l 2>/dev/null | grep -v "backup_cron.sh"; echo "0 2 * * * ${{ secrets.DEPLOY_PATH }}/scripts/backup_cron.sh >> ${{ secrets.DEPLOY_PATH }}/backups/backup.log 2>&1") | crontab -
              echo "Backup cron installed: daily at 2 AM"
            fi

      - name: Capture staging deployment context
        run: |
          echo "Staging API URL: ${{ secrets.APP_URL }}"
          echo "Deployed backend SHA: ${{ github.event.workflow_run.head_sha || github.sha }}"

  staging-api-e2e:
    name: Run staging API E2E
    runs-on: ubuntu-latest
    needs: staging-deploy
    if: needs.staging-deploy.result == 'success'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Reset staging E2E rate limit keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Flush any http_* rate limit keys Redis might have accumulated.
            docker compose -f docker-compose.prod.yml exec -T redis sh -lc '
              for pattern in http_*; do
                for key in $(redis-cli --scan --pattern "$pattern"); do
                  redis-cli DEL "$key" >/dev/null
                done
              done
              echo "Staging rate-limit keys cleared"
            ' || echo "Redis flush skipped (no redis service or no keys)."

      - name: Run live API E2E suite
        env:
          E2E_BASE_URL: ${{ secrets.APP_URL }}
          E2E_TIMEOUT_SECONDS: '60'
        run: |
          # Runs tests under tests/e2e marked with -m e2e.
          # If your project has no e2e suite, this job no-ops and production-deploy
          # still proceeds. pytest exit code 5 means "no tests collected" — treated
          # as success so projects without an e2e suite aren't blocked.
          if [ ! -d tests/e2e ]; then
            echo "No tests/e2e directory present; skipping E2E." | tee staging-api-e2e.log
            exit 0
          fi
          set +e
          poetry run pytest tests/e2e -m e2e -q 2>&1 | tee staging-api-e2e.log
          ec=${PIPESTATUS[0]}
          set -e
          if [ "$ec" -eq 0 ]; then
            exit 0
          elif [ "$ec" -eq 5 ]; then
            echo "No e2e tests collected (exit 5); treating as success." | tee -a staging-api-e2e.log
            exit 0
          else
            exit "$ec"
          fi

      - name: Upload API E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-api-e2e-logs
          path: staging-api-e2e.log

  production-deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest
    needs: [staging-api-e2e]
    concurrency:
      group: timpbills-production-deploy
      cancel-in-progress: false
    if: |
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')) &&
      needs.staging-api-e2e.result == 'success'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save API image
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t timpbills-api:$IMAGE_TAG .
          docker save timpbills-api:$IMAGE_TAG | gzip > api-image.tar.gz

      - name: Decrypt production .env
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
        run: |
          if [ -f .env.production.enc ] && [ -n "$ENV_ENCRYPTION_KEY" ]; then
            openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
              -in .env.production.enc -out .env -pass "pass:$ENV_ENCRYPTION_KEY"
            echo "Decrypted production .env successfully"
          else
            echo "No .env.production.enc or key — server .env must already exist at $DEPLOY_PATH/.env"
          fi

      - name: Copy files to production stack directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "api-image.tar.gz,docker-compose.prod.yml,alembic.ini,alembic/,.env"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            docker load < api-image.tar.gz
            export API_IMAGE="timpbills-api:${{ github.event.workflow_run.head_sha || github.sha }}"
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml run --rm api sh -c '[ -f /app/scripts/seed_data.py ] && python /app/scripts/seed_data.py || echo "No seed script; skipping."'
            docker compose -f docker-compose.prod.yml up -d
            HEALTH_URL="http://localhost:${{ secrets.API_PORT || 8000 }}/api/v1/health"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
                echo "Production API is healthy."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Production API failed health check after waiting." >&2
                docker compose -f docker-compose.prod.yml ps >&2 || true
                docker compose -f docker-compose.prod.yml logs --tail=200 >&2 || true
                exit 1
              fi
              echo "Waiting for production API health ($attempt/12)..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            rm -f api-image.tar.gz
            if [ -f scripts/backup_cron.sh ]; then
              chmod +x scripts/backup_cron.sh
              (crontab -l 2>/dev/null | grep -v "backup_cron.sh"; echo "0 2 * * * ${{ secrets.DEPLOY_PATH }}/scripts/backup_cron.sh >> ${{ secrets.DEPLOY_PATH }}/backups/backup.log 2>&1") | crontab -
              echo "Backup cron installed: daily at 2 AM"
            fi

      - name: Notify deployment status
        if: always()
        run: |
          echo "Production deployment ${{ job.status }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Actor: ${{ github.actor }}"
