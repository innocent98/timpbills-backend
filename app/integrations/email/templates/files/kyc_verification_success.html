{% extends "_layout.html" %}
{% block body %}
  <h2 style="color: #0F172A; font-size: 24px; font-weight: 700; margin: 0 0 12px;">You're verified</h2>
  <p style="color: #475569; font-size: 15px; line-height: 1.6; margin: 0 0 24px;">
    Your {{ verification_type_label }} verification succeeded. You're now <strong>Tier {{ tier }}</strong> — your wallet limit is now <strong>{{ wallet_cap_label }}</strong>.
  </p>
  <p style="color: #64748B; font-size: 13px; line-height: 1.6; margin: 0;">
    Need help? Reply to this email.
  </p>
{% endblock %}
