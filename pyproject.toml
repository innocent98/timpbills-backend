[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "timpbills-backend"
version = "0.1.0"
description = "A FastAPI project"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.11.0"
pydantic-settings = "^2.9.0"
python-multipart = "^0.0.20"
python-dotenv = "^1.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt", "argon2"], version = "^1.7.4"}
bcrypt = "~4.0.1"  # pin to 4.0.x — passlib 1.7 can't read bcrypt 4.1+ __about__ attr
argon2-cffi = "^23.1.0"  # primary password scheme; passlib reads via its argon2 backend
sqlalchemy = "^2.0.41"
alembic = "^1.15.0"
loguru = "^0.7.3"
emails = "^0.6"
jinja2 = "^3.1.6"
email-validator = "^2.2.0"
httpx = "^0.27.0"
python-dateutil = "^2.8.2"
gunicorn = "^23.0.0"
psycopg2-binary = "^2.9.10"
redis = "^5.0.0"
slowapi = "^0.1.9"
resend = "^2.5.1"
celery = {extras = ["redis"], version = "^5.4.0"}
tenacity = "^9.0.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.17.0"}
# Note: firebase-admin intentionally omitted — grpcio has no Python 3.14
# wheels. Sprint 3 uses FakePushClient only. Real FCM ships as a follow-up
# using the HTTP v1 API directly via httpx + google-auth — see
# docs/superpowers/plans/2026-04-21-sprint-3-airtime-data.md §4 (B13).
google-auth = ">=2.30"
google-auth-oauthlib = ">=1.2"
cloudinary = "^1.44.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
black = "^24.10.0"
flake8 = "^7.1.0"
mypy = "^1.13.0"
isort = "^5.13.0"
pylint = "^3.3.0"
pre-commit = "^4.0.0"
ipython = "^8.29.0"
ruff = "^0.8.0"
fakeredis = "^2.25.0"

[tool.poetry.scripts]
start = "app.main:start"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "alembic"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
  "E501",  # line too long — formatter handles where it can
  # FastAPI canonical patterns — these aren't bugs, they're how FastAPI works
  "B008",  # `Depends()` in argument defaults IS the FastAPI dependency-injection idiom
  "B904",  # raise-from in HTTPException handlers — verbose noise in endpoint code
  # Codebase naming conventions (pre-existing; renaming exception classes
  # would cascade through every caller for zero functional gain)
  "N818",  # exception name should end in Error
  "N806",  # variable case in function — test fixtures use Session / SessionLocal
  "N802",  # function case — `test_X_does_Y` use mixed case in tests
  # Pragmatic ignores for test code
  "B007",  # unused loop variable (`for _attempt in range(2)`)
  "B017",  # pytest.raises(Exception) — broad assertion intentional in some tests
  "F841",  # local variable assigned but unused — intentional in test scaffolds
  # Late module-level imports are intentional in app/api/deps.py and a few
  # services to break circular import chains; rule's "all imports at top"
  # principle predates how FastAPI dependency wiring works in practice.
  "E402",
  # Single semicolon-chained statements in tests for compact fixture setup
  "E702",
  # isinstance with tuple is valid Python and not strictly "deprecated"
  "UP038",
]

[tool.ruff.lint.per-file-ignores]
# Tests do late inside-function imports for speed; module-level E402 there is fine.
"tests/**/*.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=app --cov-report=term-missing --cov-report=html"
