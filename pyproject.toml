[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "timpbills-backend"
version = "0.1.0"
description = "A FastAPI project"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.11.0"
pydantic-settings = "^2.9.0"
python-multipart = "^0.0.20"
python-dotenv = "^1.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "~4.0.1"  # pin to 4.0.x — passlib 1.7 can't read bcrypt 4.1+ __about__ attr
sqlalchemy = "^2.0.41"
alembic = "^1.15.0"
loguru = "^0.7.3"
emails = "^0.6"
jinja2 = "^3.1.6"
email-validator = "^2.2.0"
httpx = "^0.27.0"
python-dateutil = "^2.8.2"
gunicorn = "^23.0.0"
psycopg2-binary = "^2.9.10"
redis = "^5.0.0"
slowapi = "^0.1.9"
resend = "^2.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
black = "^24.10.0"
flake8 = "^7.1.0"
mypy = "^1.13.0"
isort = "^5.13.0"
pylint = "^3.3.0"
pre-commit = "^4.0.0"
ipython = "^8.29.0"
ruff = "^0.8.0"
fakeredis = "^2.25.0"

[tool.poetry.scripts]
start = "app.main:start"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "alembic"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=app --cov-report=term-missing --cov-report=html"
