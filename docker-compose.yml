services:
  api:
    image: timpbills-backend:dev
    build:
      context: .
      target: dev
    container_name: timpbills_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    env_file:
      - .env
    # Override DATABASE_URL + REDIS_URL to use docker-network service names.
    # Everything else (SECRET_KEY, RESEND_API_KEY, etc.) comes from .env as-is.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timpbills}:${POSTGRES_PASSWORD:-timpbills_dev}@db:5432/${POSTGRES_DB:-timpbills}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    image: timpbills-backend:dev
    command: celery -A app.workers.celery_app worker -l info --max-tasks-per-child=200
    container_name: timpbills_worker
    init: true  # tini reaps prefork orphans — no <defunct> celery processes
    volumes:
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timpbills}:${POSTGRES_PASSWORD:-timpbills_dev}@db:5432/${POSTGRES_DB:-timpbills}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: timpbills-backend:dev
    command: celery -A app.workers.celery_app beat -l info --schedule=/tmp/celerybeat-schedule --pidfile=
    container_name: timpbills_beat
    init: true
    volumes:
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timpbills}:${POSTGRES_PASSWORD:-timpbills_dev}@db:5432/${POSTGRES_DB:-timpbills}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: timpbills_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timpbills}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timpbills_dev}
      POSTGRES_DB: ${POSTGRES_DB:-timpbills}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timpbills}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: timpbills_redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
